[pytest]
# Only the external service's pytest suite is collected. The cs_integration_lab/
# directory holds an Odoo addon whose tests require an Odoo runtime and are run
# by Odoo's own test runner, not pytest.
testpaths = tests
norecursedirs = cs_integration_lab .venv .git postman docs
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q --strict-markers
filterwarnings =
    ignore::DeprecationWarning
markers =
    live: hits a real external service; deselected by default (-m "not live")
