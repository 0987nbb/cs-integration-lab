version: '3.8'

services:
  db:
    image: postgres:16
    container_name: cs_integration_db
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: always

  web:
    image: odoo:19.0
    container_name: cs_integration_web
    depends_on:
      - db
    ports:
      - "8069:8069"
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo
    volumes:
      - odoo_data:/var/lib/odoo
      - ./odoo.conf:/etc/odoo/odoo.conf
      - ./cs_integration_lab:/mnt/extra-addons/cs_integration_lab
    restart: always

volumes:
  db_data:
  odoo_data:
